<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HomeSake · Portal design preview</title>
<style>
:root{--navy:#142337;--gold:#b99a58;--ink:#213247;--muted:#617185;--line:#dce3e8;--paper:#f3f5f6;--green:#226447;--red:#a13732}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bd8f2f;outline-offset:3px}button{min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 15px;font-weight:600}button:hover{background:#eef2f5}.primary{background:var(--navy);color:white;border-color:var(--navy)}.primary:hover{background:#2c425b}.danger{color:var(--red)}.toolbar{position:sticky;top:0;z-index:30;background:#e9dfca;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.toolbar strong{display:block}.roles{display:flex;gap:5px;flex-wrap:wrap}.roles button{font-size:13px;padding:5px 12px}.roles button[aria-pressed=true]{background:var(--navy);color:white}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}aside{background:var(--navy);color:#f3f0e8;padding:28px 16px}.brand{font-family:Georgia,serif;font-size:30px;margin:0 12px 4px}.tag{margin:0 12px 26px;font-size:12px;color:#c7d1dd}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;color:#ccd6e0;font-weight:500}nav button[aria-current=page]{background:#ffffff15;color:white;border-color:#ffffff25}.aside-note{margin:32px 12px;color:#c7d1dd;font-size:12px}main{max-width:1220px;width:100%;margin:auto;padding:32px clamp(16px,4vw,48px)}h1{font:36px/1.15 Georgia,serif;margin:7px 0 12px;letter-spacing:-.5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 6px}p{margin:0 0 12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted)}.header{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:24px}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;min-width:0}.card p:last-child{margin-bottom:0}.metric{font-size:32px;line-height:1.2;font-weight:700;margin:8px 0}.metric small{font-size:15px;font-weight:500;color:var(--muted)}.status{display:inline-block;padding:4px 9px;background:#e7f2eb;color:var(--green);font-size:12px;font-weight:700;border-radius:20px}.status.warn{color:#81530e;background:#fff1d4}.status.urgent{color:var(--red);background:#fbeae7}.alert{border-left:4px solid var(--red);margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.spacing{margin-top:20px}.photo{height:150px;background:linear-gradient(145deg,#eef2f5,#dae2e6);display:grid;place-items:center;color:#52677d;border-radius:9px;font-size:13px;margin-bottom:16px}.photo svg{width:110px;height:82px}.sample{font-size:12px;background:#edf1f4;border-radius:5px;padding:4px 8px;display:inline-block}.checkrow{padding:15px 0;border-bottom:1px solid var(--line)}.tasktop{display:flex;gap:12px;align-items:start}.tasktop label{flex:1;font-weight:600}input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy);flex-shrink:0;margin:2px 0}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #c6d0da;border-radius:8px;padding:11px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}label.field{display:block;font-size:13px;font-weight:600;margin-top:15px}label.field>*{margin-top:5px}.tasktools{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 34px}.tasktools button,.tasktools select{font-size:12px;padding:7px 10px}.tasktools select{width:auto;max-width:100%}.progress{height:7px;border-radius:8px;background:#e5ebef;margin-top:14px;overflow:hidden}.progress>div{height:100%;background:var(--green);width:0;transition:width .2s}.grouphead{display:flex;align-items:center;justify-content:space-between;gap:10px}.grouphead label{display:flex;align-items:center;gap:10px;font-weight:700}.empty{padding:24px 0;color:var(--muted)}.back{margin-bottom:20px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline>*{flex:1}.inline label{min-width:150px}.booking{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.booking button[aria-pressed=true]{background:var(--navy);color:white}dialog{border:1px solid var(--line);border-radius:16px;max-width:560px;width:calc(100% - 30px);max-height:85dvh;overflow:auto;padding:26px;color:var(--ink)}dialog::backdrop{background:#11223899}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialoghead button{padding:5px 12px}#notice{position:fixed;bottom:22px;right:22px;max-width:calc(100vw - 44px);z-index:100;background:var(--navy);color:white;border-radius:10px;padding:15px 22px;box-shadow:0 8px 32px #0003}#notice:empty{display:none}.hero{padding:34px;background:var(--navy);color:white;border-radius:16px;margin-bottom:22px}.hero h1{font-size:42px;max-width:650px}.hero p{max-width:630px;color:#d4dde7}.hero button{background:#e3c98f;color:var(--navy);border-color:#e3c98f}.featured{border:2px solid var(--gold)}.price{font-size:29px;font-weight:700}.small{font-size:12px}.keyvalue{padding:12px 0;border-bottom:1px solid var(--line)}.keyvalue strong{display:block}.tabtip{background:#eaf0f5;padding:13px 16px;border-radius:9px;margin:16px 0;color:#41566d;font-size:13px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{padding:13px 16px}.brand{font-size:24px;margin-left:0}.tag,.aside-note{display:none}nav{display:flex;overflow-x:auto;margin-top:10px;gap:4px}nav button{white-space:nowrap;font-size:13px;padding:8px 12px}.two,.three{grid-template-columns:1fr}.header{display:block}.header>button{margin-top:8px}main{padding-top:22px}h1{font-size:30px}.toolbar{padding:9px 14px;position:relative}.hero{padding:23px}.hero h1{font-size:34px}.card{padding:18px}.booking{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="toolbar"><div><strong>HomeSake design review</strong>Sample information · actions only affect this preview</div><div class="roles" aria-label="Choose a preview"></div></div>
<div class="shell"><aside><div class="brand">HomeSake</div><p class="tag">Your home, taken care of.</p><nav aria-label="Portal navigation"></nav><p class="aside-note">Designed around the home,<br>the next visit, and what needs attention.</p></aside><main id="main"></main></div>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button type="button" aria-label="Close dialog" id="close">✕</button></div><div id="dialogbody"></div></dialog><div id="notice" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const menus={Client:['Overview','Visits','My Home','Requests','Membership'],Technician:['Today','Upcoming','Visit'],Admin:['Today','Calendar','Clients','Team','Inbox','Billing','Settings'],Website:['Home','Join']};
let role='Client',page='Overview',timer,selectedSlot='';
let resolved=false, sent=false, tasks=[{title:'Check under kitchen sink for visible leaks',completed:true,condition:'No concern',note:'',reason:''},{title:'Replace standard HVAC filter as needed',completed:true,condition:'No concern',note:'20 × 25 × 1 standard filter replaced.',reason:''},{title:'Test smoke and CO detectors',completed:false,condition:'No concern',note:'',reason:''},{title:'Check upstairs bathroom toilet supply',completed:false,condition:'Urgent',note:'Visible drip at supply valve. Homeowner notified.',reason:''},{title:'Check water-softener salt',completed:false,condition:'No concern',note:'',reason:''}];
const homePhoto='<div class="photo" role="img" aria-label="Illustration placeholder for a home photo"><svg viewBox="0 0 120 85" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 39L60 5l52 34M20 33v47h80V33M49 80V53h22v27M29 45h12v14H29zM80 45h12v14H80z"/></svg><span>Home photo · sample placeholder</span></div>';
const btn=(text,action,cls='')=>`<button type="button" class="${cls}" data-action="${action}">${text}</button>`;
const go=(text,target)=>btn(text,'go:'+target);
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
function toast(text){$('#notice').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('#notice').textContent='',5000)}
function modal(title,html){$('#dialogtitle').textContent=title;$('#dialogbody').innerHTML=html;$('#dialog').showModal()}
$('#close').onclick=()=>$('#dialog').close();
function render(){
$('.roles').innerHTML=Object.keys(menus).map(x=>`<button type="button" data-role="${x}" aria-pressed="${x===role}">${x}</button>`).join('');
$('nav').innerHTML=menus[role].map(x=>`<button type="button" data-page="${x}" ${page===x?'aria-current="page"':''}>${x}</button>`).join('');
$('#main').innerHTML=`<header class="header"><div><span class="eyebrow">${role==='Website'?'Welcome home':role+' portal · sample home'}</span><h1>${heading()}</h1><p class="muted">${subtitle()}</p></div>${role==='Client'?go('Request something','Requests'):''}</header>`+(role==='Client'?client():role==='Technician'?tech():role==='Admin'?admin():website());
}
function heading(){if(role==='Client'&&page==='Overview')return 'Your home, taken care of.';if(role==='Technician'&&page==='Today')return 'Your day at a glance';if(role==='Admin'&&page==='Today')return 'Today’s operations';if(role==='Website'&&page==='Home')return 'A simpler way to care for your home';return page}
function subtitle(){if(role==='Client')return '125 Sample Lane · South Elgin · Signature membership';if(role==='Technician')return 'Arrival times, home details, and a clear next step.';if(role==='Admin')return 'Appointments, customer inquiries, and items needing action.';return 'Scheduled care. Included standard supplies. A record of every visit.'}
function issue(){return `<section class="card alert"><div class="inline"><h2>${resolved?'Repair reported resolved':'Immediate attention needed'}</h2><span class="status ${resolved?'':'urgent'}">${resolved?'Reported fixed':'Urgent'}</span></div><h3>Drip at upstairs toilet supply valve</h3><p>Recorded during the latest visit. The technician documented the concern and notified the homeowner.</p><div class="actions">${btn('View notes & photos','issue')}${!resolved?btn('Mark resolved','resolve'):''}${btn('Ask HomeSake to coordinate','coordinate')}</div></section>`}
function client(){
if(page==='Overview')return `<div class="grid three">${card('Home score','<div class="metric">82 <small>/ 100</small></div><span class="status warn">Attention needed</span><p class="small muted spacing">Illustrative score. Scoring rules still need validation.</p>')}${card('Completed today','<div class="metric">28 <small>checks · 4 upkeep tasks</small></div><p class="muted">Latest published visit</p>')}${card('Membership total','<div class="metric">284 <small>checks · 31 upkeep tasks</small></div><p class="muted">Documented across 8 visits</p>')}</div>${issue()}<div class="grid two">${card('Latest visit','<span class="status">Report available</span><h3 class="spacing">Routine monthly care</h3><p>Standard filter replaced, detector batteries checked, and cabinet hardware tightened.</p>'+go('Open visit report','Visits'))}${card('Your next visit','<h3>Second Saturday · 10–11 a.m.</h3><p class="muted">Recurring appointment · assigned specialist shown here</p>'+btn('Change appointment','reschedule'))}</div>`;
if(page==='Visits')return card('Service history',`<p class="muted">Every report stays with your home.</p><div class="row"><div><h3>Latest monthly visit</h3><p>28 checks · 4 upkeep tasks · 1 urgent finding</p></div>${btn('Read report','report')}</div><div class="row"><div><h3>Previous monthly visit</h3><p>30 checks · 3 upkeep tasks · 1 follow-up</p></div>${btn('Read report','report')}</div><div class="actions">${btn('Preview maintenance record','history')}</div>`);
if(page==='My Home')return `<div class="grid two">${card('Home profile',homePhoto+'<div class="keyvalue"><strong>HVAC filter</strong>20 × 25 × 1 · standard</div><div class="keyvalue"><strong>Detector batteries</strong>AA and 9V · locations recorded at setup</div><div class="keyvalue"><strong>Main water shutoff</strong>Basement utility room · photo and instructions</div><div class="keyvalue"><strong>Electrical panel</strong>Garage north wall · location photo</div>')}${card('People & permissions','<div class="keyvalue"><strong>Homeowner</strong>Receives reports · approves extra work</div><div class="keyvalue"><strong>Authorized family member</strong>Separate login · report access</div><div class="keyvalue"><strong>Emergency contact</strong>Name, relationship, phone, and contact order</div><p class="spacing muted">Property-specific emergency permissions recorded during setup.</p>'+btn('Review emergency plan','emergency'))}</div>`;
if(page==='Requests')return card('What can we help with?',`<form data-form="request"><label class="field">Service<select><option>Something for my next visit</option><option>Additional service</option><option>Help coordinating a contractor</option></select></label><fieldset class="spacing"><legend>Common requests</legend><label><input type="checkbox"> Check a detector</label><br><label><input type="checkbox"> Replace a filter</label><br><label><input type="checkbox"> Check a visible leak</label></fieldset><label class="field">Tell us what you need<textarea required placeholder="Add a location or details for your specialist"></textarea></label><label class="field">Attach pictures<input type="file" accept="image/*" multiple></label><button class="primary spacing">Send request</button></form><div class="tabtip">Sample specialty-item approval</div><h3>Specialty HVAC filter · $45 sample quote</h3><p>Choose how you’d like to provide the item before it is purchased.</p><div class="actions">${btn('Approve purchase','approve')}${btn('I’ll supply it','supply')}</div>`);
return card('Your membership','<h3>Signature · monthly visits</h3><p>Existing plan price and billing terms will appear here.</p><div class="row"><span>Payment method</span><span>Card ending 4242 · sample</span></div><div class="row"><span>Next invoice</span><span>Shown before the billing date</span></div><div class="actions">'+btn('Payment & invoices','billing')+btn('Manage renewal','renewal')+'</div>');
}
function tech(){
if(page==='Today'||page==='Upcoming')return `<div class="grid two">${card(page==='Today'?'Today’s appointments':'Upcoming visits',`<div class="row"><div><span class="status">${page==='Today'?'Next visit':'Scheduled'}</span><h3 class="spacing">6:30 p.m. · Sample homeowner</h3><p>125 Sample Lane, South Elgin</p><p class="small muted">Monthly care · 60 minutes</p></div>${go('Open visit','Visit')}</div><div class="row"><div><h3>7:45 p.m. · New client setup</h3><p>240 Example Court, South Elgin</p><p class="small muted">Setup + maintenance · 90 minutes</p></div>${btn('Open setup','setup')}</div>`)}${card('Before you leave','<p>Review filter sizes, client requests, and unresolved concerns before the appointment.</p><h3>Supplies for today</h3><p>Standard 20 × 25 × 1 filter, AA and 9V batteries.</p><p class="muted small">Sample list derived from the selected homes.</p>')}</div>`;
const count=tasks.filter(t=>t.completed).length;
return `<div class="grid two">${card('125 Sample Lane',homePhoto+'<p><strong>Arrival · 6:30 p.m.</strong></p><p>Homeowner expects to be home. Ring the doorbell.</p><h3>Client request</h3><p>Please check the upstairs toilet supply.</p><div class="actions">'+btn('Home & supply details','setup')+btn('Emergency plan','emergency')+'</div>')}${card('Visit progress',`<div class="metric">${count} <small>of ${tasks.length} sample tasks completed</small></div><div class="progress"><div style="width:${count/tasks.length*100}%"></div></div><p class="spacing muted">Complete the group after doing the work. Record exceptions on each task.</p>${btn('Review & finish visit','summary','primary')}`)}</div><section class="card spacing"><div class="grouphead"><label><input type="checkbox" id="group" ${count===tasks.length?'checked':''}> Complete group</label><span class="small muted">Routine home care</span></div>${tasks.map((t,i)=>`<div class="checkrow"><div class="tasktop"><input aria-label="Complete ${t.title}" type="checkbox" data-task="${i}" ${t.completed?'checked':''}><label>${t.title}</label><span class="status ${t.condition==='Urgent'?'urgent':''}">${t.condition}</span></div><div class="tasktools"><select aria-label="Completion status for ${t.title}" data-completion="${i}"><option value="pending" ${!t.completed&&!t.reason?'selected':''}>Not yet checked</option><option value="completed" ${t.completed?'selected':''}>Completed</option><option value="notdone" ${t.reason&&t.reason!=='Not applicable'?'selected':''}>Not completed</option><option value="na" ${t.reason==='Not applicable'?'selected':''}>Not applicable</option></select><select aria-label="Condition for ${t.title}" data-condition="${i}">${['No concern','Needs attention','Urgent','Reported fixed'].map(x=>`<option ${t.condition===x?'selected':''}>${x}</option>`).join('')}</select>${btn('Notes','note:'+i)}${btn('Pics','pics:'+i)}</div><p class="small muted" id="task-note-${i}"></p></div>`).join('')}</section>`;
}
function admin(){
if(page==='Today')return `<div class="grid three">${card('Today’s visits','<div class="metric">2</div><p class="muted">2 assigned · 0 uncovered</p>')}${card('New inquiries','<div class="metric">3</div>'+go('Open inbox','Inbox'))}${card('Needs action','<div class="metric">1</div><p class="muted">Urgent finding awaiting follow-up</p>')}</div><div class="grid two spacing">${card('Appointments & assignments',`<div class="row"><div><h3>6:30 p.m. · 125 Sample Lane</h3><p>Assigned to Steven · monthly care</p></div>${btn('Reassign','reassign')}</div><div class="row"><div><h3>7:45 p.m. · 240 Example Court</h3><p>Assigned to Steven · first visit</p></div>${btn('Reassign','reassign')}</div><div class="actions">${btn('Reassign a date range','reassign')}</div>`)}${card('Follow-up queue','<span class="status urgent">Urgent</span><h3 class="spacing">Toilet supply leak</h3><p>Homeowner contacted · contractor decision pending</p>'+btn('Open issue','issue')+'<div class="row"><div><h3>Specialty filter</h3><p>Waiting for purchase approval</p></div></div>')}</div>`;
if(page==='Calendar')return card('Schedule visits',`<p>Review availability and recurring visits with travel time between homes.</p><div class="actions">${btn('Book first visit','booking')}${btn('Set recurring appointment','recurring')}${btn('Cover time off','reassign')}</div><div class="tabtip">Initial availability · weekdays after 6:30 p.m. and weekends · approximately 20 hours per week.</div>`);
if(page==='Clients')return card('Clients & homes',`<div class="row"><div><h3>Sample homeowner</h3><p>125 Sample Lane · Signature</p></div>${btn('Open home record','setup')}</div><div class="actions">${btn('Add a client','addclient')}${btn('Review latest report','report')}</div>`);
if(page==='Team')return card('Technician coverage',`<div class="row"><div><h3>Steven</h3><p>2 appointments today</p></div><span class="status">Available</span></div><p class="spacing muted">Your first visits are owner-operated. Additional staff will appear here when added.</p>${btn('Reassign visits','reassign')}`);
if(page==='Inbox')return card('Customer inquiries',`<div class="row"><div><h3>Website consultation request</h3><p>New homeowner · interested in monthly care</p></div>${btn('Open inquiry','inquiry')}</div><div class="row"><div><h3>Website chat</h3><p>Question about caring for a parent’s home</p></div>${btn('Open conversation','inquiry')}</div>`);
if(page==='Billing')return card('Billing & approvals',`<div class="row"><div><h3>Specialty filter · $45 sample quote</h3><p>Customer approval pending</p></div>${btn('Review quote','quote')}</div><p class="spacing muted">Membership invoices, payment status, and approved extras belong together.</p>`);
return card('Operating settings',`<h3>Visit lengths</h3><p>First visit · 75–90 minutes<br>Regular visit · approximately 45–60 minutes</p><h3 class="spacing">Service area</h3><p>Initial focus · within 10 miles of South Elgin</p><h3 class="spacing">Late cancellation / access</h3><p>First courtesy waiver, then $35. Waiver period and rescheduling treatment need confirmation before publication.</p>`);
}
function website(){if(page==='Join')return card('Choose your first visit',`<p>Your membership includes the first setup and maintenance visit.</p><ol><li>Confirm your home and membership</li><li>Select an available setup appointment</li><li>Complete enrollment and receive confirmation</li></ol>${btn('Try the booking flow','booking','primary')}`);return `<div class="hero"><span class="sample">Proposed homepage flow</span><h1>Routine home upkeep, handled for you.</h1><p>Scheduled home checks, everyday maintenance, included standard supplies, and a clear record of your home’s care.</p><div class="actions">${go('Choose a membership','Join')}${btn('Free phone consultation','consult')}</div></div><div class="grid three">${card('1 · Join','Choose the existing membership and visit schedule that suits your home.')}${card('2 · Meet your specialist','Your included first visit establishes your home profile and starts maintenance.')}${card('3 · See what was done','Get a clear visit report with work completed, photos, and anything needing attention.')}</div><section class="card featured spacing"><span class="status">Recommended focus</span><h2 class="spacing">Signature · monthly home care</h2><p>Keep the existing membership prices and quarterly / monthly schedules. Emphasize the value of the monthly plan.</p>${go('See signup flow','Join')}</section>`}
function booking(){modal('Book your first visit',`<p>Setup + maintenance · allow 90 minutes</p><p class="muted">Sample availability within the initial service schedule.</p><div class="booking">${['Weekday · 6:30 p.m.','Saturday · 9 a.m.','Saturday · 11 a.m.','Sunday · 10 a.m.'].map(t=>btn(t,'slot:'+t)).join('')}</div><div class="actions">${btn('Confirm sample appointment','confirmbooking','primary')}</div><p class="small spacing muted">Production booking will check conflicts, travel buffers, and weekly capacity before confirming.</p>`)}
function action(a){
if(a.startsWith('go:')){page=a.slice(3);render();return}if(a.startsWith('slot:')){selectedSlot=a.slice(5);$('#dialogbody').querySelectorAll('[data-action^="slot:"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===a)));return}
if(a.startsWith('note:')){const i=Number(a.split(':')[1]);modal('Task note','<label class="field">Details<textarea id="note-text"></textarea></label>'+btn('Save note','savenote:'+i,'primary spacing'));$('#note-text').value=tasks[i].note;return}
if(a.startsWith('savenote:')){const i=Number(a.split(':')[1]);tasks[i].note=$('#note-text').value;$('#dialog').close();render();showNotes();return}
if(a.startsWith('pics:')){modal('Attach a task photo','<p>Associate each picture with this task.</p><label class="field">Choose pictures<input id="task-photo" type="file" accept="image/*" multiple></label><div id="photo-preview" class="spacing"></div><p class="small muted spacing">Pictures are previewed locally for this design review.</p>');return}
if(a==='booking'||a==='reschedule'){selectedSlot='';booking();return}
if(a==='confirmbooking'){if(!selectedSlot){toast('Select a sample time first.');return}$('#dialog').close();toast('Sample appointment confirmed. A confirmation email would follow.');return}
if(a==='summary'){const unmarked=tasks.filter(t=>!t.completed&&!t.reason).length;modal('Review before sending',`<p><strong>${tasks.filter(t=>t.completed).length}</strong> tasks completed · <strong>${tasks.filter(t=>t.reason&&t.reason!=='Not applicable').length}</strong> follow-ups · <strong>${tasks.filter(t=>t.condition==='Urgent').length}</strong> urgent findings</p><div id="summary-notes"></div>${unmarked?'<p class="status warn">'+unmarked+' tasks still need a completion status.</p>':''}<p class="spacing">The client receives this report directly. Admin can review it.</p><button type="button" class="primary" data-action="publish" ${unmarked?'disabled':''}>Send sample report</button>`);for(const t of tasks){const p=document.createElement('p');p.textContent=t.title+' — '+(t.completed?'Completed':t.reason||'Not yet checked')+(t.note?' · '+t.note:'');$('#summary-notes').append(p)}return}
if(a==='publish'){$('#dialog').close();sent=true;toast('Sample report published to client and admin views.');return}
if(a==='resolve'){modal('Record a resolution','<label class="field">What was repaired?<textarea id="resolution" required></textarea></label><label class="field">Supporting photo (optional)<input type="file" accept="image/*"></label><p class="small muted spacing">The record will show who marked it resolved and when. Homeowner-reported repairs stay distinguishable from a technician’s verification.</p>'+btn('Mark reported resolved','resolved','primary'));return}
if(a==='resolved'){if(!$('#resolution').value.trim()){toast('Add a short repair note.');return}resolved=true;$('#dialog').close();render();toast('Sample resolution recorded.');return}
if(a==='reassign'){modal('Reassign appointments','<form data-form="reassign"><div class="inline"><label class="field">From<input type="date" required></label><label class="field">Through<input type="date" required></label></div><label class="field">Covering technician<select><option>Sample covering technician</option></select></label><p class="muted spacing">Review affected appointments and availability before confirming. The usual assignment resumes after this date range.</p><button class="primary">Preview reassignment</button></form>');return}
if(a==='setup'){modal('First visit · home setup','<p>Allow 75–90 minutes including maintenance.</p><div class="grid two"><label class="field">Filter size<input placeholder="e.g. 20 × 25 × 1"></label><label class="field">Battery types<input placeholder="AA, 9V, sealed units"></label></div><label class="field">Water shutoff location<input placeholder="Location + access instructions"></label><label class="field">Electrical panel location<input placeholder="Location + photo"></label><label class="field">Home and equipment photos<input type="file" accept="image/*" multiple></label><div class="actions">'+btn('Review emergency permissions','emergency')+btn('Save sample home profile','saved')+'</div>');return}
if(a==='emergency'){modal('Property emergency plan','<p>Agree on the plan with the homeowner during setup.</p><label class="field">Emergency contact<input placeholder="Name, relationship, and phone"></label><label class="field">Homeowner-approved actions<textarea placeholder="Record the specific actions approved for this property"></textarea></label><p class="muted small spacing">Operating instructions require review for training, authorization, and safe limits before use.</p>'+btn('Save sample plan','saved','primary'));return}
if(a==='issue'||a==='report'){modal(a==='issue'?'Issue details':'Visit report',`<span class="status ${resolved?'':'urgent'}">${resolved?'Reported resolved':'Urgent finding'}</span><h3 class="spacing">Upstairs toilet supply</h3><p>Technician documented a visible drip, notified the homeowner, and recorded next steps.</p><div class="photo">Task-specific photo appears here</div><p><strong>Completed</strong> · standard HVAC filter replaced</p><p><strong>Follow-up</strong> · specialty item pending approval</p><p class="small muted">${sent?'Sample report has been published.':'Sample published visit report.'}</p>`);return}
if(a==='history'){modal('Home maintenance record','<p>Share a dated record of visits, completed work, findings, and documented repairs.</p><div class="row"><strong>Visit</strong><strong>Documented work</strong></div><div class="row"><span>Latest monthly visit</span><span>Filter, detectors, visible checks</span></div><p class="small muted spacing">Personal contact details, access codes, and private staff notes should be excluded from a buyer-facing export.</p>');return}
if(a==='recurring'){modal('Recurring appointment','<label class="field">Repeat<select><option>Monthly · Signature / Estate</option><option>Quarterly · Essential</option></select></label><label class="field">Preferred pattern<select><option>Second Saturday · 10 a.m.</option><option>Third Sunday · 11 a.m.</option></select></label><p class="muted spacing">Review future dates and technician capacity before creating visits.</p>'+btn('Preview schedule','saved','primary'));return}
if(a==='consult'||a==='addclient'||a==='inquiry'){modal(a==='consult'?'Free phone consultation':a==='addclient'?'Add a client':'Customer inquiry','<form data-form="contact"><label class="field">Name<input required autocomplete="name"></label><label class="field">Email<input required type="email" autocomplete="email"></label><label class="field">Phone<input type="tel" autocomplete="tel"></label><label class="field">Notes<textarea></textarea></label><button class="primary spacing">Save sample details</button></form>');return}
if(a==='renewal'){modal('Manage renewal','<p>Show the current term, next renewal date, and effect of cancellation before confirming.</p><p class="muted">The existing membership terms will control the actual cancellation flow.</p>');return}
if(a==='billing'){modal('Invoices & payment','<p>Paid membership invoices, outstanding approved extras, and payment method controls appear here.</p>');return}
if(a==='quote'){modal('Specialty-item quote','<h3>Specialty filter · $45 sample price</h3><p>Approval required before purchase. The homeowner can also supply the item.</p>');return}
if(a==='coordinate'){toast('Sample contractor coordination request added to the admin queue.');return}
if(a==='approve'||a==='supply'){toast(a==='approve'?'Sample purchase approved.':'Sample preference saved — homeowner will supply the item.');return}
if(a==='saved'){$('#dialog').close();toast('Sample action confirmed. This walkthrough uses demonstration data.');return}
}
function showNotes(){tasks.forEach((t,i)=>{const el=$('#task-note-'+i);if(el)el.textContent=[t.reason,t.note].filter(Boolean).join(' · ')})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){role=b.dataset.role;page=menus[role][0];render();return}if(b.dataset.page){page=b.dataset.page;render();showNotes();return}if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='group'){for(const t of tasks){if(t.reason==='Not applicable'||t.reason)continue;t.completed=el.checked}render();showNotes();return}if(el.dataset.task!==undefined){tasks[Number(el.dataset.task)].completed=el.checked;tasks[Number(el.dataset.task)].reason='';render();showNotes();return}if(el.dataset.condition!==undefined){tasks[Number(el.dataset.condition)].condition=el.value;render();showNotes();return}if(el.dataset.completion!==undefined){const i=Number(el.dataset.completion);tasks[i].completed=el.value==='completed';if(el.value==='notdone'){modal('Why wasn’t this completed?',`<label class="field">Reason<select id="reason"><option>Specialty item needed</option><option>Homeowner will supply item</option><option>Area inaccessible</option><option>Unsafe conditions</option><option>Client declined</option><option>Other — explain in notes</option></select></label><label class="field">Notes<textarea id="reason-note"></textarea></label><p class="muted spacing">Unfinished applicable work carries forward to the next visit.</p>${btn('Save follow-up','followup:'+i,'primary')}`)}else{tasks[i].reason=el.value==='na'?'Not applicable':'';render();showNotes()}return}if(el.id==='task-photo'){const node=$('#photo-preview');node.replaceChildren();for(const f of el.files){const p=document.createElement('p');p.textContent=f.name;node.append(p)}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action^="followup:"]');if(!b)return;const i=Number(b.dataset.action.split(':')[1]);tasks[i].reason=$('#reason').value;tasks[i].note=$('#reason-note').value;$('#dialog').close();render();showNotes()});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='reassign'){const d=e.target.querySelectorAll('input[type=date]');if(d[1].value<d[0].value){toast('End date must be on or after the start date.');return}toast('Sample reassignment preview ready. Production will check each technician’s availability.')}else toast('Sample request received.');if($('#dialog').open)$('#dialog').close()});
render();
</script></body></html>
